services:
  postgres:
    image: postgres:18.6
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: metrl
      POSTGRES_PASSWORD: metrl
      POSTGRES_DB: metrl
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "metrl"]
      interval: 2s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: metrl
      RUSTFS_SECRET_KEY: metrl-dev-secret
    ports: ["127.0.0.1:9000:9000"]
    volumes: [rustfs:/data]

volumes:
  postgres:
  rustfs:
