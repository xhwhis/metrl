[project]
name = "metrl"
version = "0.0.0"
description = "Metrl worker runtime and engine protocols"
license = "Unlicense"
requires-python = ">=3.14"
dependencies = ["uvloop>=0.23"]

[project.scripts]
metrl-worker = "metrl.worker.main:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "maturin>=1.16",
  "metrl-engine-mlx",
  "metrl-engine-mock",
  "pytest>=9.2",
  "ruff>=0.17",
  "tinker>=0.39",
  "types-protobuf>=7.35",
  "ty>=0.0.100",
]

[build-system]
requires = ["maturin>=1.16"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/bindings/python/Cargo.toml"
python-source = "python"
module-name = "metrl._core"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "crates/**/*.rs" },
  { file = "crates/**/Cargo.toml" },
  { file = "proto/*.proto" },
]

[tool.uv.workspace]
members = ["engines/*"]

[tool.uv.sources]
metrl-engine-mlx = { workspace = true }
metrl-engine-mock = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PERF",
  "PGH",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "T20",
  "TID252",
  "UP",
  "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
