syntax = "proto3";

package metrl.peer;

// Served by every server. Sample results live in the memory of the server
// that ran the request; other servers fetch them here.
service PeerService {
  rpc GetSampleResult(GetSampleResultRequest) returns (GetSampleResultResponse);
}

message GetSampleResultRequest {
  string org_id = 1;
  string request_id = 2;
}

message GetSampleResultResponse {
  bytes result = 1;
}
