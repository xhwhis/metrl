syntax = "proto3";

package metrl.worker;

// Served by every worker; servers dial it. Requests that name a `worker_id`
// fail with FAILED_PRECONDITION when another worker answers at the address.
service WorkerService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // INVALID_ARGUMENT for a request the engine cannot run as given; its
  // message is shown to the user.
  rpc Sample(SampleRequest) returns (SampleResponse);
  // Makes `generation` the model's owner on this worker, creating the trainer
  // state on first bind. ABORTED for an older generation than the bound one.
  rpc Bind(BindRequest) returns (BindResponse);
  // Runs one task of a bound model. ABORTED when a newer generation has bound
  // or a later seq has run; FAILED_PRECONDITION when `generation` has not
  // bound. Repeating the last seq returns its response without running it
  // again. Task failures are responses, not errors.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

message BindRequest {
  string worker_id = 1;
  string model_id = 2;
  uint64 generation = 3;
  string base = 4;
  uint32 lora_rank = 5;
  uint64 seed = 6;
  string revision = 7;
}

message BindResponse {}

message ExecuteRequest {
  string worker_id = 1;
  string model_id = 2;
  uint64 generation = 3;
  uint64 seq = 4;
  oneof task {
    ForwardBackward forward_backward = 5;
    AdamParams optim_step = 6;
    SaveWeightsForSampler save_weights_for_sampler = 7;
  }
}

// Reads a Tinker `ForwardBackwardRequest` from `input_key` and writes a Tinker
// `ForwardBackwardOutput` to `output_key`, which is unique to the request and
// generation.
message ForwardBackward {
  string input_key = 1;
  string output_key = 2;
}

message AdamParams {
  double learning_rate = 1;
  double beta1 = 2;
  double beta2 = 3;
  double eps = 4;
  double weight_decay = 5;
  double grad_clip_norm = 6;
}

message ExecuteResponse {
  oneof outcome {
    ForwardBackwardDone forward_backward = 1;
    OptimStepDone optim_step = 2;
    TaskFailed failed = 3;
    SaveWeightsForSamplerDone save_weights_for_sampler = 4;
  }
}

message ForwardBackwardDone {
  // The `output_key` of the call that ran the task. A repeated call after a
  // takeover returns the earlier generation's key.
  string output_key = 1;
}

message OptimStepDone {
  map<string, double> metrics = 1;
}

// Writes the model's current adapter under `prefix`, which is unique to the
// request and generation: `adapter_model.safetensors`, `adapter_config.json`,
// then `manifest.json`.
message SaveWeightsForSampler {
  string prefix = 1;
}

message SaveWeightsForSamplerDone {
  // The `prefix` of the call that ran the task. A repeated call after a
  // takeover returns the earlier generation's prefix.
  string prefix = 1;
  // Total size of the files written.
  uint64 size_bytes = 2;
}

message TaskFailed {
  ErrorCategory category = 1;
  string message = 2;
}

enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  ERROR_CATEGORY_USER = 1;
  ERROR_CATEGORY_SERVER = 2;
}

message SampleRequest {
  // The sampling session.
  string model_id = 1;
  string base_model = 2;
  repeated int32 prompt = 3;
  uint32 num_samples = 4;
  uint32 max_tokens = 5;
  // Unset samples differently on every call.
  optional uint64 seed = 6;
  string worker_id = 7;
  // The saved adapter's object prefix, or empty for the bare base.
  string adapter = 8;
  double temperature = 9;
  // -1 for no limit.
  int32 top_k = 10;
  double top_p = 11;
  // Unset keeps the engine's implicit end-of-sequence stop.
  Stop stop = 12;
  bool prompt_logprobs = 13;
}

// At most one of the lists is non-empty; both empty disables every stop.
message Stop {
  repeated int32 tokens = 1;
  repeated string strings = 2;
}

message SampleResponse {
  repeated SampledSequence sequences = 1;
  // With `prompt_logprobs`, one per prompt token, NaN for the first, which has
  // no context; otherwise empty.
  repeated float prompt_logprobs = 2;
}

message SampledSequence {
  repeated int32 tokens = 1;
  // One per token, under the distribution it was drawn from.
  repeated float logprobs = 2;
  StopReason stop_reason = 3;
}

// Tinker's values. Every sequence stops for one of them, so there is no
// unspecified value.
enum StopReason {
  STOP_REASON_STOP = 0;
  STOP_REASON_LENGTH = 1;
}

message DescribeRequest {}

message DescribeResponse {
  string worker_id = 1;
  repeated Base bases = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_TRAINER = 1;
  ROLE_SAMPLER = 2;
}

message Base {
  string name = 1;
  string revision = 2;
  string arch = 3;
  string tokenizer_id = 4;
  uint32 max_context_length = 5;
  uint32 max_lora_rank = 6;
  repeated Role roles = 7;
}
