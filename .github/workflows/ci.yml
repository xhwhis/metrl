name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: metrl
          POSTGRES_DB: metrl
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: -c wal_level=logical
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U metrl"
          --health-interval 2s
          --health-retries 30

      rustfs:
        image: rustfs/rustfs:1.0.5
        env:
          RUSTFS_ACCESS_KEY: metrl
          RUSTFS_SECRET_KEY: metrl-dev-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@cargo-shear
      - uses: taiki-e/install-action@taplo
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: install dependencies
        run: |
          rustc +nightly --version
          cargo +nightly --version
          sudo apt update
          sudo apt install -y protobuf-compiler
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/astral-sh/hawk/releases/latest/download/cargo-hawk-installer.sh | sh
          uv sync --locked

      - name: cargo shear
        run: cargo +nightly shear

      - name: spell check
        uses: crate-ci/typos@v1

      - name: taplo
        run: |
          taplo check
          taplo fmt --check --diff

      - name: cargo fmt
        run: cargo +nightly fmt --all --check

      - name: clippy lint
        run: cargo +nightly clippy --workspace --all-targets --all-features -- -D warnings

      - name: hawk
        run: cargo +1.99.0 hawk check -D warnings --exclude-crate metrl_proto

      - name: ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: ty
        run: |
          uv run --no-sync maturin develop --uv --generate-stubs
          uv run --no-sync ty check

      - name: e2e
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://metrl
          cargo +nightly build -p metrl-bin --bin metrl-server --features failpoints
          uv run --no-sync pytest -q
        env:
          AWS_ACCESS_KEY_ID: metrl
          AWS_SECRET_ACCESS_KEY: metrl-dev-secret
          AWS_REGION: us-east-1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@nextest

      - name: install dependencies
        run: |
          rustc --version
          cargo --version
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: cargo build
        run: cargo build --workspace --all-targets --all-features

      - name: cargo nextest
        run: cargo nextest run --workspace --all-targets --all-features --no-tests=pass

  mlx:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: install dependencies
        run: |
          brew install protobuf postgresql@18 rustfs/homebrew-tap/rustfs
          uv sync --locked

      - name: start postgres
        run: |
          pg="$(brew --prefix postgresql@18)/bin"
          echo "$pg" >> "$GITHUB_PATH"
          "$pg/initdb" -D "$RUNNER_TEMP/postgres" -U metrl --auth=trust
          "$pg/pg_ctl" -D "$RUNNER_TEMP/postgres" -l "$RUNNER_TEMP/postgres.log" -w start \
            -o "-c wal_level=logical -c listen_addresses=127.0.0.1"

      - name: start rustfs
        run: |
          mkdir -p "$RUNNER_TEMP/rustfs"
          nohup rustfs server --address 127.0.0.1:9000 "$RUNNER_TEMP/rustfs" \
            > "$RUNNER_TEMP/rustfs.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:9000/health
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://metrl
        env:
          RUSTFS_ACCESS_KEY: metrl
          RUSTFS_SECRET_KEY: metrl-dev-secret
          AWS_ACCESS_KEY_ID: metrl
          AWS_SECRET_ACCESS_KEY: metrl-dev-secret
          AWS_REGION: us-east-1

      - name: e2e
        run: |
          cargo +nightly build -p metrl-bin --bin metrl-server --features failpoints
          uv run --no-sync maturin develop --uv
          uv run --no-sync pytest -q tests/test_mlx.py
