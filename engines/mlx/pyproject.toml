[project]
name = "metrl-engine-mlx"
version = "0.0.0"
description = "Metrl engine on MLX for local development on Apple silicon"
license = "Unlicense"
requires-python = ">=3.14"
dependencies = ["mlx>=0.32", "mlx-lm>=0.32", "numpy>=2.5"]

[build-system]
requires = ["uv_build>=0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "metrl.engines.mlx"
