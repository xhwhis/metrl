[workspace]
members = [
  "crates/api",
  "crates/bin",
  "crates/bindings/python",
  "crates/common/config",
  "crates/common/error",
  "crates/common/proto",
  "crates/common/telemetry",
  "crates/common/types",
  "crates/common/utils",
  "crates/meta",
  "crates/object",
  "crates/scheduler",
  "crates/server",
  "crates/worker",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Unlicense"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
redundant_imports = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
assigning_clones = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
clone_on_ref_ptr = "warn"
collection_is_never_read = "warn"
error_impl_error = "warn"
exit = "warn"
fallible_impl_from = "warn"
future_not_send = "warn"
if_then_some_else_none = "warn"
let_underscore_must_use = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
missing_assert_message = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
set_contains_or_insert = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
string_add = "warn"
string_slice = "warn"
trait_duplication_in_bounds = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
unnecessary_rest_pattern = "warn"
unused_peekable = "warn"
unwrap_used = "warn"

[workspace.dependencies]
# workspace crates
metrl-api = { path = "crates/api" }
metrl-config = { path = "crates/common/config" }
metrl-proto = { path = "crates/common/proto" }
metrl-server = { path = "crates/server" }
metrl-telemetry = { path = "crates/common/telemetry" }
metrl-types = { path = "crates/common/types" }
metrl-utils = { path = "crates/common/utils" }
metrl-worker = { path = "crates/worker" }

# crates.io
axum = "0.8"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
error-stack = { version = "0.8", default-features = false, features = ["std"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false }
prost = "0.14"
pyo3 = "0.30"
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }
tokio-util = "0.7"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.metadata.cargo-shear]
ignored = ["prost", "tonic-prost"]

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
